name: Generate Documentation and API Reference

# Trigger the action on push to main or manual workflow dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
      - name: Dotnet Setup
        uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 #v5.0.1
        with:
          dotnet-version: 8.x

      - run: dotnet tool update -g docfx --version 2.78.4
      - run: docfx docs/docfx.json
      
      - name: Add base tag for subdirectory deployment
        run: |
          find docs/_site -name "*.html" -type f -exec sed -i 's|<head[^>]*>|&\n    <base href="/${{ github.event.repository.name }}/">|' {} +
      
      - name: Create .nojekyll file
        run: touch docs/_site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa #v3.0.1
        with:
          # Upload docs site
          path: "docs/_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e #v4.0.5
        
